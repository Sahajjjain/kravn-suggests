spring.application.name=KravN Suggests
server.port=8080

# Your private keys live in secrets.properties (never commit that file).
# Environment variables TMDB_TOKEN and ANTHROPIC_API_KEY also work.
spring.config.import=optional:file:./secrets.properties
tmdb.token=${TMDB_TOKEN:}
tmdb.region=IN
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5
