spring.application.name=KravN Suggests
# Cloud hosts such as Render tell us which port to use through PORT.
server.port=${PORT:8080}

# Your private keys live in secrets.properties (never commit that file).
# Environment variables TMDB_TOKEN and ANTHROPIC_API_KEY also work.
spring.config.import=optional:file:./secrets.properties
tmdb.token=${TMDB_TOKEN:}
tmdb.region=IN
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5
# Maximum AI scorings per day (cached movies cost nothing). Protects your bill when the site is public.
anthropic.daily-limit=300

# Short error messages for the browser, no stack traces.
server.error.include-message=always
server.error.include-stacktrace=never

# Always re-check static files so a new deploy shows up immediately (no stale app.js).
spring.web.resources.cache.cachecontrol.no-cache=true
